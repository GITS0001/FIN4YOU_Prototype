<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="FIN4YOU — AI-powered financial decision assistant. Understand your finances, forecast the future, and make smarter decisions." />
    <meta name="theme-color" content="#F6F7FB" />
    <title>FIN4YOU — Financial AI Assistant</title>
    <script>
      // Apply theme before first paint to avoid a flash of the wrong theme
      (function () {
        try {
          var saved = localStorage.getItem('theme');
          var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
          var root = document.documentElement;
          root.classList.add(dark ? 'dark' : 'light');
          if (dark) document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0A0F1E');
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..700&family=Outfit:wght@300..700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <a href="#main-content" class="sr-only focus:not-sr-only focus:fixed focus:top-3 focus:left-3 focus:z-[100] focus:px-4 focus:py-2 focus:rounded-lg focus:bg-card-bg focus:text-primary-dark focus:shadow-lg">Skip to content</a>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
